<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#202622">
    <title>Fog · Market Lane</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Fog <span>Market Lane</span></h1>
        <button id="sound" type="button">Enable sound</button>
      </header>
      <canvas id="scene" tabindex="0" role="group" aria-label="Rainy town with a café, houses and a park" aria-describedby="instructions"></canvas>
      <footer>
        <p id="instructions">Move or drag to listen. Select a building, road, or open sky to change it.</p>
        <nav aria-label="Fog scenes">
          <a href="./">Market Lane</a>
          <a href="?mode=foothill">Foothill town</a>
          <a href="./townscape.html">Hillside preview</a>
        </nav>
        <fieldset id="foothill-controls" hidden>
          <legend>Foothill review</legend>
          <label>Resolution <select id="foothill-size"><option value="1920">1920 × 1080</option><option value="960">960 × 540</option></select></label>
          <label>Overlay <select id="foothill-overlay">
            <option value="">None</option><option value="terrain">Terrain</option><option value="exclusions">Exclusions</option>
            <option value="grades">Road grade</option><option value="connectivity">Connectivity</option>
          </select></label>
          <label><input id="foothill-mist" type="checkbox" checked> Mist</label>
          <button id="foothill-shop" type="button">Replace shop</button>
          <button id="foothill-street" type="button">Replace shop street</button>
          <button id="foothill-town" type="button">Replace town</button>
        </fieldset>
        <p id="status" role="status"></p>
      </footer>
      <dialog id="sound-mixer" aria-labelledby="sound-mixer-title" aria-keyshortcuts="Alt+S">
        <h2 id="sound-mixer-title">Sound settings</h2>
        <div class="mix-levels" role="group" aria-label="Sound mixing levels"></div>
      </dialog>
    </main>
    <script type="module" src="/src/pilot/main.ts"></script>
  </body>
</html>
